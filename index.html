<style>
/* Layout: placar de estádio — barra superior com abas, conteúdo em cartões estreitos (max 1040px), tabelas roláveis */

  --bg:#F3F5F1; --surface:#FFFFFF; --surface2:#EAEFE8; --line:#D9E0D6; --fg:#16211B; --muted:#5E6B63;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --bill:#F2B347; --bill-soft:#3A2D12; --bill-ink:#F7D08A;
  --good:#5BC57E; --good-soft:#163222; --bad:#EE7B70; --bad-soft:#3A1C1A; --info:#7EA6EC; --info-soft:#1B2740; color-scheme:dark}}
:root[data-theme="dark"]{

  --good:#5BC57E; --good-soft:#163222; --bad:#EE7B70; --bad-soft:#3A1C1A; --info:#7EA6EC; --info-soft:#1B2740; color-scheme:dark}

table{border-collapse:collapse;width:100%;font-size:13px}

th{font-family:var(--display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--muted);background:var(--surface2);position:sticky;top:0}
td.l,th.l{text-align:left}

.me-row td{background:var(--pitch-soft)}

.zone{width:4px;padding:0}
.z-lib{background:var(--info)} .z-pre{background:color-mix(in srgb,var(--info) 45%,transparent)} .z-sul{background:var(--good)} .z-reb{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pitch);color:var(--pitch-ink)}
svg text{fill:var(--muted);font-family:var(--body)}
.pname{all:unset;cursor:pointer;font-weight:700;color:var(--fg);border-bottom:1px dashed var(--muted)}
.pname:focus-visible{outline:2px solid var(--bill);outline-offset:2px}
tr.detail td{background:var(--surface2);white-space:normal;text-align:left}
.pd{position:sticky;left:0;width:min(100%,calc(100vw - 40px));max-width:640px;padding:12px}
.pdl{display:grid;gap:4px;margin-top:8px}

.pdj{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pdb,.pdp{text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.claim{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.claim button{font:700 18px var(--display);letter-spacing:.03em;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.claim button:disabled{opacity:.45;cursor:default}
.adm input[type=text]{width:64px;text-align:center;font:700 15px var(--body);padding:5px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);color:var(--fg)}
.adm input.wide{width:150px}

@media (max-width:520px){
  #tabs [data-tab=brasileirao],#tabs [data-tab=regras],#tabs [data-tab=resultados],#tabs [data-tab=admin]{display:none!important}
  nav.tabs{justify-content:space-between}
  td.l{white-space:normal;min-width:110px}
  .adm input.wide{width:130px!important}
  .rules td{white-space:normal}
  .lk{display:none}

  .game .star{grid-column:1/-1;justify-self:center;width:auto;height:34px;border-radius:999px;padding:0 14px;font-size:14px}
  .score input{width:40px;height:40px}
  h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS=["#2563EB","#0E9F9A","#E89B16","#DC2626","#7C3AED","#16A34A","#DB2777","#64748B","#0891B2","#A16207"];
const S={db:null,user:null,uid:null,canEdit:false,canWrite:null,readOnly:false,
  cfg:null,rod:{},rodRaw:{},resDocs:{},parc:{},acessos:{},hist:{},own:{},rev:{},envio:null,resCode:null,bets:{},subsBets:{},memb:{},ajus:{},loaded:{},tokens:null,tokSlug:null,verified:{},subsOwn:{},claimed:false,tab:"palpitar",round:null,actAs:null,rankMode:"temp",hide:{},
  draft:null,saveTimer:null,saving:false,saveMsg:""};
// O app sempre abre em Palpitar, na rodada em andamento (a aba escolhida antes não é restaurada).
if(location.hash&&/^#(palpitar|rodada|ranking|brasileirao|regras)$/.test(location.hash))S.tab=location.hash.slice(1);

/* ---------- regras de pontuação ---------- */
function parse(s){const m=/^\s*(\d+)\s*x\s*(\d+)\s*$/i.exec(s||"");return m?[+m[1],+m[2]]:null;}
function base(bet,res){
  const g=parse(bet),r=parse(res); if(!g||!r) return 0;
  if(g[0]===r[0]&&g[1]===r[1]) return 9;
  const sg=Math.sign(g[0]-g[1]),sr=Math.sign(r[0]-r[1]); if(sg!==sr) return 0;
  if(sr===0) return 5;
  if(Math.max(...g)===Math.max(...r)) return 6;
  if(Math.min(...g)===Math.min(...r)) return 5;
  if(g[0]-g[1]===r[0]-r[1]) return 4;
  return 3;
}
const played=j=>!!parse(j.res);
const resTag=j=>`<span class="res${j.aoVivo?" lv":""}">${esc(j.res)}</span>`+(j.aoVivo?` <span class="pill live" title="Placar parcial${j.parcEm?" atualizado às "+new Date(j.parcEm).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"}):""}">ao vivo${j.parcMin?" "+esc(j.parcMin):""}</span>${j.parcEm?` <span class="muted" style="font-size:11px">às ${hhmm(j.parcEm)}</span>`:""}`:"");
const hhmm=t=>new Date(t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"});
function lastUpd(){ let m=""; for(const d of [...Object.values(S.parc),...Object.values(S.resDocs)]) if(d&&d.em&&String(d.em)>m) m=String(d.em); return m?new Date(m):null; }
const updLine=()=>{const d=lastUpd(); return d&&!isNaN(d)?`<p class="sub" style="margin:4px 0 8px">🕒 Última atualização automática: <b>${d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",timeZone:"America/Sao_Paulo"})} às ${hhmm(d)}</b>${anyLive()?" · próxima em até 30 min":""}</p>`:"";};
const anyLive=()=>Object.values(S.rod).some(r=>r.jogos.some(j=>j.aoVivo));
const liveNote=()=>anyLive()?`<div class="notice warn"><b>Classificação parcial:</b> inclui jogos em andamento (<span class="pill live">ao vivo</span>). Os placares parciais são atualizados a cada 30 minutos e substituídos pelo placar final quando o jogo termina.</div>`:"";
const kickoff=j=>j.quando?new Date(j.quando):null;
function locked(j){if(played(j)||j.res==="Adiado")return true;const k=kickoff(j);return !!(k&&Date.now()>=k.getTime());}
function dobroPrazo(n){ const fx=S.cfg&&S.cfg.dobroPrazo&&S.cfg.dobroPrazo[n]; if(fx) return new Date(fx);
  const r=S.rod[n]; if(!r) return null; const ks=r.jogos.map(kickoff).filter(Boolean).map(d=>d.getTime()); return ks.length?new Date(Math.min(...ks)):null; }
function dobroFechado(n){ const d=dobroPrazo(n); return !!(d&&Date.now()>=d.getTime()); }
const fmtWhen=j=>{const k=kickoff(j);if(!k)return "data a definir";
  return k.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",timeZone:"America/Sao_Paulo"})+" · "+k.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"});};
const fmt=n=>n==null?"—":Number(n).toLocaleString("pt-BR");

/* ---------- cálculo ---------- */
function parts(){return (S.cfg&&S.cfg.participantes)||[];}
function activeIn(p,n){return n>=(p.desde||1);}
function calc(){
  // returns per round: {n, byP:{slug:{bets,pts[],dobro,raw,tot,acum,pb,pg,hist}}, complete, any}
  const out={}; const last={}; // last acum per slug
  for(let n=1;n<=38;n++){
    const r=S.rod[n]; if(!r) continue;
    const H=S.hist[n]; const A=S.ajus[n]||{};
    const anyPlayed=r.jogos.some(played);
    const complete=r.jogos.every(j=>played(j)||j.res==="Adiado");
    const byP={};
    for(const p of parts()){
      if(!activeIn(p,n)) continue; const s=p.slug;
      let bets,pts,dobro,raw=null,tot=null,acum=null,pg=null,pb=null,hist=false;
      if(H&&H.palpites&&H.palpites[s]){
        hist=true; bets=H.palpites[s]; pts=H.pts[s]; dobro=H.dobro[s];
        raw=pts.reduce((a,b)=>a+(b||0),0); tot=H.tot[s]; acum=H.acum[s]; pg=H.pg[s]; pb=H.pb[s];
      }else{
        const d=betsFor(n,s); bets=d.palpites.slice(); dobro=d.dobro;
        pts=r.jogos.map((j,i)=>{ if(!played(j)) return null; const b=base(bets[i],j.res); return dobro===i?b*2:b; });
        if(anyPlayed){ raw=pts.reduce((a,b)=>a+(b||0),0); tot=Math.floor(raw*(1+r.peso)+1e-9);
          acum=(A.acum&&A.acum[s]!=null)?A.acum[s]:((last[s]??0)+tot); }
        pg=A.pg&&A.pg[s]!=null?A.pg[s]:null;
      }
      if(acum!=null) last[s]=acum;
      byP[s]={bets,pts,dobro,raw,tot,acum,pg,pb,hist};
    }
    // posição no bolão quando não vem do histórico
    const withAc=Object.entries(byP).filter(([s,v])=>v.acum!=null&&!v.hist);
    if(withAc.length){ const sorted=withAc.map(([s,v])=>v.acum).sort((a,b)=>b-a);
      for(const [s,v] of withAc) v.pb=sorted.indexOf(v.acum)+1; }
    out[n]={n,byP,complete,any:anyPlayed};
  }
  return out;
}
function currentRound(){ // rodada em andamento: a última que já começou, se ainda não terminou; senão a seguinte
  const now=Date.now(); let L=0;
  for(let n=1;n<=38;n++){const r=S.rod[n]; if(r&&r.jogos.some(j=>{const k=kickoff(j);return k&&k.getTime()<=now;})) L=n;}
  if(!L){ for(let n=1;n<=38;n++) if(S.rod[n]) return n; return 1; }
  let nx=null; for(let n=L+1;n<=38;n++) if(S.rod[n]){nx=n;break;}
  if(!nx) return L;
  const ks=S.rod[nx].jogos.map(kickoff).filter(Boolean).map(d=>d.getTime()); const nextStart=ks.length?Math.min(...ks):null;
  // continua na rodada L enquanto ela tiver jogo pendente no fluxo normal (antes do início da próxima rodada);
  // jogos remarcados para depois disso viram "pendentes de rodada anterior"
  const fluxo=S.rod[L].jogos.some(j=>{ if(played(j)&&!j.aoVivo||j.res==="Adiado") return false; if(j.aoVivo) return true;
    const k=kickoff(j); return !!k&&(nextStart==null||k.getTime()<nextStart); });
  return fluxo?L:nx;
}
const JANELA_PEND=48*3600e3; // aviso aparece 48 h antes do início e some quando o jogo começa
function pendentesAnteriores(){ // jogos de rodadas anteriores à atual que ainda não aconteceram e começam em até 48 h
  const cur=currentRound(), now=Date.now(), out=[];
  for(let n=1;n<cur;n++){ const r=S.rod[n]; if(!r) continue;
    r.jogos.forEach((j,i)=>{ if(played(j)||j.res==="Adiado") return; const k=kickoff(j); if(!k) return;
      const t=k.getTime(); if(t>now&&t-now<=JANELA_PEND) out.push({n,i,j,t}); }); }
  return out.sort((a,b)=>a.t-b.t);
}
function avisoPendentes(){
  const pend=pendentesAnteriores().filter(p=>p.n!==S.round); const cur=currentRound();
  let h="";
  if(pend.length){

function brTable(){
  const T={}; const add=(t)=>T[t]||(T[t]={t,j:0,v:0,e:0,d:0,gp:0,gc:0});
  for(let n=1;n<=38;n++){const r=S.rod[n]; if(!r) continue; for(const j of r.jogos){ add(j.m);add(j.v); const s=j.aoVivo?null:parse(j.res); if(!s) continue;
    const a=T[j.m],b=T[j.v]; a.j++;b.j++; a.gp+=s[0];a.gc+=s[1];b.gp+=s[1];b.gc+=s[0];
    if(s[0]>s[1]){a.v++;b.d++;}else if(s[0]<s[1]){b.v++;a.d++;}else{a.e++;b.e++;} }}
  const rows=Object.values(T).map(x=>({...x,p:x.v*3+x.e,sg:x.gp-x.gc}));
  rows.sort((a,b)=>b.p-a.p||b.v-a.v||b.sg-a.sg||b.gp-a.gp||a.t.localeCompare(b.t));
  return rows;
}

async function identify(){
  if(S._idDone||!S.cfg||!S.cfg.hashes) return; S._idDone=true;
  const t=linkToken(); if(!t) return; const h=await sha(t);
  const slug=Object.keys(S.cfg.hashes).find(k=>S.cfg.hashes[k]===h);
  if(!slug){ S.badToken=true; try{localStorage.removeItem("bp_token");}catch(e){} render(); return; }
  S.tokSlug=slug; render();
  if(!S.uid||!S.db||!S.cfg.pubkeys||!S.cfg.pubkeys[slug]) return;
  try{
    const dbuf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("bolao-key:"+t));
    const pk=S.cfg.pubkeys[slug];
    const key=await crypto.subtle.importKey("jwk",{kty:"EC",crv:"P-256",d:b64u(dbuf),x:pk.x,y:pk.y,ext:true},{name:"ECDSA",namedCurve:"P-256"},false,["sign"]);
    const cur=await S.db.doc("membros/"+S.uid).get(); const d=cur.exists?cur.data():null;
    if(d&&d.slug===slug&&d.sig&&await checkSig(slug,S.uid,d.sig)) return;
    const sig=b64u(await crypto.subtle.sign({name:"ECDSA",hash:"SHA-256"},key,new TextEncoder().encode(S.uid)));
    await S.db.doc("membros/"+S.uid).set({slug,sig,em:new Date().toISOString()});
  }catch(e){}
}
const sigCache={};
async function checkSig(slug,uid,sig){
  const k=slug+"|"+uid+"|"+sig; if(k in sigCache) return sigCache[k];
  let ok=false; try{ const pk=S.cfg.pubkeys[slug];
    const key=await crypto.subtle.importKey("jwk",{kty:"EC",crv:"P-256",x:pk.x,y:pk.y,ext:true},{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    ok=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,unb64u(sig),new TextEncoder().encode(uid)); }catch(e){ ok=false; }
  return sigCache[k]=ok;
}
async function verify(){
  if(!S.cfg||!S.cfg.pubkeys) return; const v={};
  for(const [uid,m] of Object.entries(S.memb)){ if(!m||!m.slug||!m.sig||!S.cfg.pubkeys[m.slug]) continue;
    if(await checkSig(m.slug,uid,m.sig)){ if(!v[m.slug]||String(m.em)<String(v[m.slug].em)) v[m.slug]={uid,em:m.em}; } }
  S.verified={}; for(const [sl,x] of Object.entries(v)) S.verified[sl]=x.uid;
  for(const uid of Object.values(S.verified)) if(uid!==S.uid&&!S.subsBets[uid]){ S.subsBets[uid]=true;
    S.db.collection("palpites/"+uid+"/r").onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data();});S.bets[uid]=m;render();},()=>{}); }
  render();
}
/* ---------- dados ---------- */
async function start(){
  const db=await (window.claude&&claude.use?claude.use("db"):null);
  const user=await (window.claude&&claude.use?claude.use("user"):null);
  if(!db){ $("#who").innerHTML=`<span class="chip">sem login</span>`;
    $("#app").innerHTML=`<h2>Bem-vindo ao Bolão dos Patos</h2><p class="sub">Para ver o ranking e palpitar, você precisa entrar com uma conta do Claude (é gratuita).</p>
    <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Como entrar</h3>
    <ol style="margin:0;padding-left:20px;display:grid;gap:8px">
      <li>Crie sua conta grátis em <b>claude.ai</b> (pode usar o e-mail ou a conta Google).</li>
      <li>Mande para o organizador o <b>e-mail</b> que você usou, para ele liberar seu acesso.</li>
      <li>Depois de liberado, abra de novo <b>este mesmo link</b> já logado. Ele é exclusivo seu: não repasse.</li>
    </ol></div>
    <p class="sub" style="margin-top:12px">Já tem conta? Entre no claude.ai neste navegador e recarregue a página.</p>`; return; }
  S.db=db; S.user=user;
  if(user){ S.uid=await user.id(); S.canEdit=await user.isOwner(); S.canWrite=await user.can("data.write"); }
  const err=()=>{};
  const num=id=>parseInt(String(id).replace(/\D/g,""),10);
  db.doc("config/geral").onSnapshot(s=>{S.cfg=s.exists?s.data():{participantes:[]};S.loaded.config=true;identify();verify();render();},err);
  const mergeRod=()=>{ const o={}; for(const [n,r] of Object.entries(S.rodRaw)){ o[n]={...r,jogos:r.jogos.map((j,i)=>{const k="r"+String(n).padStart(2,"0")+"-g"+i; const R=S.resDocs[k]; if(R&&R.res) return {...j,res:R.res}; if(j.res) return j; const P=S.parc[k]; return P&&parse(P.res)?{...j,res:P.res,aoVivo:true,parcMin:P.min||"",parcEm:P.em||""}:j;})}; } S.rod=o; };
  db.collection("rodadas").onSnapshot(q=>{S.rodRaw={};q.docs.forEach(d=>{S.rodRaw[num(d.id)]=d.data();});mergeRod();S.loaded.rodadas=true;
    if(q.empty){$("#app").innerHTML=`<div class="empty">O bolão ainda não tem rodadas cadastradas.</div>`;return;} render();},err);
  db.collection("resultados").onSnapshot(q=>{S.resDocs={};q.docs.forEach(d=>{S.resDocs[d.id]=d.data();});mergeRod();render();},err);
  db.collection("parciais").onSnapshot(q=>{S.parc={};q.docs.forEach(d=>{S.parc[d.id]=d.data();});mergeRod();render();},err);
  db.collection("historico").onSnapshot(q=>{S.hist={};q.docs.forEach(d=>{S.hist[num(d.id)]=d.data();});render();},err);
  db.collection("revelados").onSnapshot(q=>{S.rev={};q.docs.forEach(d=>{S.rev[d.id]=d.data();});render();},err);
  db.collection("membros").onSnapshot(q=>{S.memb={};q.docs.forEach(d=>{S.memb[d.id]=d.data();});verify();},err);
  db.collection("ajustes").onSnapshot(q=>{S.ajus={};q.docs.forEach(d=>{S.ajus[num(d.id)]=d.data();});render();},err);
  if(S.uid) db.collection("palpites/"+S.uid+"/r").onSnapshot(q=>{S.own={};q.docs.forEach(d=>{S.own[d.id]=d.data();}); if(S.draft&&!S.draft.dirty) S.draft=null; render();},err);
  if(S.uid){ (async()=>{ try{ const ref=db.doc("acessos/"+S.uid); const cur=await ref.get(); const now=new Date().toISOString(); const d=cur.exists?cur.data():null;
    if(!d) await ref.set({primeiro:now,ultimo:now}); else if(String(d.ultimo||"").slice(0,13)!==now.slice(0,13)) await ref.set({primeiro:d.primeiro||now,ultimo:now}); }catch(e){} })(); }
  if(S.canEdit&&S.uid){
    db.collection("acessos").onSnapshot(q=>{S.acessos={};q.docs.forEach(d=>{S.acessos[d.id]=d.data();});render();},err);
    db.doc("data/users/"+S.uid+"/links").onSnapshot(s=>{S.tokens=s.exists?(s.data().tokens||{}):{};render();},err);
    db.doc("data/users/"+S.uid+"/segredos").onSnapshot(s=>{S.secret=s.exists?s.data().codigoResultados:null;render();},err);
  }
  try{ const c=localStorage.getItem("bp_rescode"); if(c){ S.resCode=c; if(S.uid) db.doc("resultadosEnviados/"+S.uid).onSnapshot(s=>{S.envio=s.exists?s.data():null;},err);} }catch(e){}
  setInterval(()=>{ if(!typing()) render(); },15000);
}
start();
})();
</script>
