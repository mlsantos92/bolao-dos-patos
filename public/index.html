<style>
html{color-scheme:light} body{margin:0;font-size:14px} [hidden]{display:none!important} :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: placar de estádio — barra superior com abas, conteúdo em cartões estreitos (max 1040px), tabelas roláveis */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --surface2:#EAEFE8; --line:#D9E0D6; --fg:#16211B; --muted:#5E6B63;
  --pitch:#1F6B47; --pitch-ink:#FFFFFF; --pitch-soft:#DCEDE2;
  --bill:#E89B16; --bill-soft:#FBEBCB; --bill-ink:#7A4B00;
  --good:#1E7A3E; --good-soft:#DDF3E3; --bad:#B4322A; --bad-soft:#F8E0DD; --info:#2456A6; --info-soft:#E0E9F8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18211C; --surface2:#1F2A24; --line:#2C3A32; --fg:#E7EEE9; --muted:#93A39A;
  --pitch:#3FA874; --pitch-ink:#08130D; --pitch-soft:#1C3828;
  --bill:#F2B347; --bill-soft:#3A2D12; --bill-ink:#F7D08A;
  --good:#5BC57E; --good-soft:#163222; --bad:#EE7B70; --bad-soft:#3A1C1A; --info:#7EA6EC; --info-soft:#1B2740; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --surface2:#1F2A24; --line:#2C3A32; --fg:#E7EEE9; --muted:#93A39A;
  --pitch:#3FA874; --pitch-ink:#08130D; --pitch-soft:#1C3828;
  --bill:#F2B347; --bill-soft:#3A2D12; --bill-ink:#F7D08A;
  --good:#5BC57E; --good-soft:#163222; --bad:#EE7B70; --bad-soft:#3A1C1A; --info:#7EA6EC; --info-soft:#1B2740; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pitch);color:var(--pitch-ink)}
.top .bar{max-width:1040px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-weight:600;font-size:12px;letter-spacing:.12em;opacity:.8}
.who{margin-left:auto;font-size:13px;display:flex;gap:8px;align-items:center}
.who b{font-family:var(--display);font-size:17px;letter-spacing:.03em}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18)}
nav.tabs{max-width:1040px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:10px 12px 0;scrollbar-width:none}
nav.tabs button{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;background:none;border:0;color:inherit;opacity:.72;padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--bill)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bill);outline-offset:2px}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:26px;margin:22px 0 4px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--muted);margin:22px 0 8px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.notice{border-radius:var(--r);padding:12px 14px;margin-top:14px;font-size:14px;background:var(--info-soft);color:var(--fg);border-left:4px solid var(--info)}
.notice.warn{background:var(--bill-soft);border-left-color:var(--bill)}
.atrasos{display:grid;gap:8px;margin-top:14px}
.btn.atraso{text-align:left;white-space:normal;line-height:1.35;padding:10px 12px;background:var(--bill-soft);border:1px solid var(--bill);border-radius:var(--r)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.roundnav{display:flex;align-items:center;gap:8px;margin:16px 0 4px}
.roundnav select{font-family:var(--display);font-size:20px;font-weight:700;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn{font:600 14px var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.btn.small{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted)}
/* palpites */
.games{display:grid;gap:8px}
.game{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.game.dbl{border-color:var(--bill);box-shadow:inset 4px 0 0 var(--bill)}
.game .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game .t.h{text-align:right}
.score{display:flex;align-items:center;gap:4px}
.score input{width:44px;height:42px;text-align:center;font:800 22px var(--display);border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--fg)}
.score input:disabled{opacity:.75}
.score .x{color:var(--muted);font-weight:700}
.meta{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.res{font-family:var(--display);font-weight:800;background:var(--fg);color:var(--bg);border-radius:6px;padding:0 6px;font-size:14px}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700}
.p9{background:var(--good-soft);color:var(--good)} .p18{background:var(--bill);color:#2B1900} .p0{background:var(--surface2);color:var(--muted)} .pn{background:var(--pitch-soft);color:var(--pitch)}
.star{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;color:var(--muted)}
.star[aria-pressed="true"]{background:var(--bill);border-color:var(--bill);color:#2B1900}
.star:disabled{cursor:default;opacity:.55}
.savebar{position:sticky;bottom:env(safe-area-inset-bottom,0px);margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-family:var(--display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-size:13px;color:var(--muted);background:var(--surface2);position:sticky;top:0}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface2)}
.me-row td{background:var(--pitch-soft)}
.cellbet{display:flex;flex-direction:column;align-items:center;gap:2px}
.cellbet .b{font-weight:600}
.hidden-bet{color:var(--muted);font-size:12px}
.pos{font-family:var(--display);font-weight:800;font-size:18px}
.zone{width:4px;padding:0}
.z-lib{background:var(--info)} .z-pre{background:color-mix(in srgb,var(--info) 45%,transparent)} .z-sul{background:var(--good)} .z-reb{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--fg);padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pitch);color:var(--pitch-ink)}
svg text{fill:var(--muted);font-family:var(--body)}
.pname{all:unset;cursor:pointer;font-weight:700;color:var(--fg);border-bottom:1px dashed var(--muted)}
.pname:focus-visible{outline:2px solid var(--bill);outline-offset:2px}
tr.detail td{background:var(--surface2);white-space:normal;text-align:left}
.pd{position:sticky;left:0;width:min(100%,calc(100vw - 40px));max-width:640px;padding:12px}
.pdl{display:grid;gap:4px;margin-top:8px}
.pdi{display:grid;grid-template-columns:1fr auto 54px 58px;gap:8px;align-items:center;background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px}
.pdj{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pdb,.pdp{text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.claim{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.claim button{font:700 18px var(--display);letter-spacing:.03em;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.claim button:disabled{opacity:.45;cursor:default}
.adm input[type=text]{width:64px;text-align:center;font:700 15px var(--body);padding:5px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);color:var(--fg)}
.adm input.wide{width:150px}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:520px){
  #tabs [data-tab=brasileirao],#tabs [data-tab=regras],#tabs [data-tab=resultados],#tabs [data-tab=admin]{display:none!important}
  nav.tabs{justify-content:space-between}
  td.l{white-space:normal;min-width:110px}
  .adm input.wide{width:130px!important}
  .rules td{white-space:normal}
  .lk{display:none}
  .game{grid-template-columns:1fr auto 1fr;padding:10px}
  .game .star{grid-column:1/-1;justify-self:center;width:auto;height:34px;border-radius:999px;padding:0 14px;font-size:14px}
  .score input{width:40px;height:40px}
  h2{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="top">
  <div class="bar">
    <div class="brand">Bolão dos Patos 🦆<small>Brasileirão 2026 · beta</small></div>
    <div class="who" id="who"><span class="chip">carregando…</span></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="palpitar" aria-selected="true">Palpitar</button>
    <button role="tab" data-tab="rodada" aria-selected="false">Rodada</button>
    <button role="tab" data-tab="ranking" aria-selected="false">Ranking</button>
    <button role="tab" data-tab="brasileirao" aria-selected="false">Brasileirão</button>
    <button role="tab" data-tab="regras" aria-selected="false">Regras</button>
    <button role="tab" data-tab="resultados" aria-selected="false" id="tab-res" hidden>Resultados</button>
    <button role="tab" data-tab="admin" aria-selected="false" id="tab-admin" hidden>Organização</button>
  </nav>
</header>
<main class="wrap" id="app">
  <div class="empty" id="loading">Carregando jogos, palpites e ranking do bolão…</div>
</main>

<script type="module">
// firebase.js carrega o Firebase de verdade quando existe firebase-config.js; sem ele, abre o modo demonstração
import { initializeApp, getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut,
  getFirestore, doc, getDoc, getDocs, setDoc, collection, query, where, onSnapshot, writeBatch, deleteDoc, updateDoc, serverTimestamp, Timestamp,
  firebaseConfig } from "./firebase.js";
const fbApp=initializeApp(firebaseConfig); const auth=getAuth(fbApp); const db=getFirestore(fbApp);
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS=["#2563EB","#0E9F9A","#E89B16","#DC2626","#7C3AED","#16A34A","#DB2777","#64748B","#0891B2","#A16207"];
const S={db:null,user:null,uid:null,canEdit:false,canWrite:null,readOnly:false,
  cfg:null,rod:{},rodRaw:{},resDocs:{},hist:{},own:{},rev:{},envio:null,resCode:false,bets:{},subsBets:{},revLegacy:{},ext:{},appRev:{},fetched:{},cfgExists:null,authKnown:false,memb:{},ajus:{},loaded:{},tokens:null,tokSlug:null,verified:{},subsOwn:{},claimed:false,tab:"ranking",round:null,roundAuto:true,actAs:null,rankMode:"temp",hide:{},
  draft:null,saveTimer:null,saving:false,saveMsg:""};
if(location.hash&&/^#[a-z]+$/.test(location.hash))S.tab=location.hash.slice(1);

/* ---------- regras de pontuação ---------- */
function parse(s){const m=/^\s*(\d+)\s*x\s*(\d+)\s*$/i.exec(s||"");return m?[+m[1],+m[2]]:null;}
function base(bet,res){
  const g=parse(bet),r=parse(res); if(!g||!r) return 0;
  if(g[0]===r[0]&&g[1]===r[1]) return 9;
  const sg=Math.sign(g[0]-g[1]),sr=Math.sign(r[0]-r[1]); if(sg!==sr) return 0;
  if(sr===0) return 5;
  if(Math.max(...g)===Math.max(...r)) return 6;
  if(Math.min(...g)===Math.min(...r)) return 5;
  if(g[0]-g[1]===r[0]-r[1]) return 4;
  return 3;
}
const played=j=>!!parse(j.res);
const kickoff=j=>j.quando?new Date(j.quando):null;
function pendente(j){return !played(j)&&j.res==="Adiado";} // adiado e ainda não disputado
// adiado: fica aberto até o novo horário (quando remarcado); sem nova data, segue aberto
function locked(j){if(played(j))return true;const k=kickoff(j);if(j.res==="Adiado")return !!(j.remarcado&&k&&Date.now()>=k.getTime());return !!(k&&Date.now()>=k.getTime());}
function dobroPrazo(n){ const fx=S.cfg&&S.cfg.dobroPrazo&&S.cfg.dobroPrazo[n]; if(fx) return new Date(fx);
  const r=S.rod[n]; if(!r) return null; const ks=r.jogos.map(kickoff).filter(Boolean).map(d=>d.getTime()); return ks.length?new Date(Math.min(...ks)):null; }
function dobroFechado(n){ const d=dobroPrazo(n); return !!(d&&Date.now()>=d.getTime()); }
const fmtWhen=j=>{const k=kickoff(j);if(!k)return "data a definir";
  return k.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",timeZone:"America/Sao_Paulo"})+" · "+k.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"});};
const fmt=n=>n==null?"—":Number(n).toLocaleString("pt-BR",{maximumFractionDigits:2});

/* ---------- cálculo ---------- */
function parts(){return (S.cfg&&S.cfg.participantes)||[];}
function activeIn(p,n){return n>=(p.desde||1);}
const isTeste=s=>{const p=typeof s==="string"?parts().find(x=>x.slug===s):s; return !!(p&&p.teste);};
function oficiais(){return parts().filter(p=>!p.teste);}
const pesar=(raw,peso)=>Math.floor(raw*(1+peso)+1e-9); // igual ao site: pontos da rodada × (1 + 5% por rodada), arredondado para baixo
function calc(){
  // returns per round: {n, byP:{slug:{bets,pts[],dobro,raw,tot,acum,pb,pg,hist}}, complete, any}
  const out={}; const last={}; const off={}; // last acum per slug; off = pontos de jogos adiados em rodadas da planilha
  for(let n=1;n<=38;n++){
    const r=S.rod[n]; if(!r) continue;
    const H=S.hist[n]; const A=S.ajus[n]||{};
    const anyPlayed=r.jogos.some(played);
    const complete=r.jogos.every(j=>played(j)||j.res==="Adiado");
    const byP={};
    for(const p of parts()){
      if(!activeIn(p,n)) continue; const s=p.slug;
      let bets,pts,dobro,raw=null,tot=null,acum=null,pg=null,pb=null,hist=false;
      if(H&&H.palpites&&H.palpites[s]){
        hist=true; bets=H.palpites[s].slice(); pts=H.pts[s].slice(); dobro=H.dobro[s];
        raw=pts.reduce((a,b)=>a+(b||0),0); tot=H.tot[s]; pg=H.pg[s]; pb=H.pb[s];
        let extra=false; r.jogos.forEach((j,i)=>{ if(pts[i]!=null||!played(j)) return; const R=S.rev[nnOf(n)+"-g"+i]; const bt=(R&&R.palpites&&R.palpites[s])||bets[i]||""; bets[i]=bt; const b=base(bt,j.res); pts[i]=dobro===i?b*2:b; extra=true; });
        // mesma conta do site: soma da rodada × peso, arredondada para baixo; acumulado = soma das rodadas
        raw=pts.reduce((a,b)=>a+(b||0),0); tot=pesar(raw,r.peso);
        acum=(A.acum&&A.acum[s]!=null)?A.acum[s]:((last[s]??0)+tot);
      }else{
        const d=betsFor(n,s); bets=d.palpites.slice(); dobro=d.dobro;
        pts=r.jogos.map((j,i)=>{ if(!played(j)) return null; const b=base(bets[i],j.res); return dobro===i?b*2:b; });
        if(anyPlayed){ raw=pts.reduce((a,b)=>a+(b||0),0); tot=pesar(raw,r.peso);
          acum=(A.acum&&A.acum[s]!=null)?A.acum[s]:((last[s]??0)+tot); }
        pg=A.pg&&A.pg[s]!=null?A.pg[s]:null;
      }
      if(acum!=null) last[s]=acum;
      byP[s]={bets,pts,dobro,raw,tot,acum,pg,pb,hist};
    }
    // posição no bolão quando não vem do histórico
    const withAc=Object.entries(byP).filter(([s,v])=>v.acum!=null&&!isTeste(s)); // posição recalculada em todas as rodadas (inclusive as da planilha)
    if(withAc.length){ const sorted=withAc.map(([s,v])=>v.acum).sort((a,b)=>b-a);
      for(const [s,v] of withAc) v.pb=sorted.indexOf(v.acum)+1; }
    out[n]={n,byP,complete,any:anyPlayed};
  }
  return out;
}
function firstKick(n){ const r=S.rod[n]; if(!r) return null; const ks=r.jogos.map(kickoff).filter(Boolean).map(d=>d.getTime()); return ks.length?Math.min(...ks):null; }
function nextRoundKick(n){ for(let m=n+1;m<=38;m++){ const k=firstKick(m); if(k!=null) return k; } return Infinity; }
// jogo atrasado: sem resultado e remarcado para depois do início da rodada seguinte (ou sem data, com a rodada seguinte já começada)
function atrasado(n,j){ if(played(j)) return false; if(j.res==="Adiado") return true; const k=kickoff(j); const nx=nextRoundKick(n);
  return k?k.getTime()>nx:(nx<=Date.now()); }
function currentRound(){ // primeira rodada com jogo ainda por acontecer (ignora jogos atrasados de rodadas antigas)
  for(let n=1;n<=38;n++){const r=S.rod[n];if(r&&r.jogos.some(j=>!(played(j)||j.res==="Adiado"||atrasado(n,j))))return n;}
  return 38;
}
function jogosAtrasados(){ const cur=currentRound(), now=Date.now(), L=[];
  for(let n=1;n<cur;n++){ const r=S.rod[n]; if(!r) continue;
    r.jogos.forEach((j,i)=>{ if(played(j)) return; if(!(atrasado(n,j)||kickoff(j))) return; if(!locked(j)) L.push({n,i,j}); }); }
  return L; }
function atrasadosBox(){ const me=parts().find(p=>p.slug===mySlug()); const L=jogosAtrasados().filter(x=>!me||activeIn(me,x.n)); const cur=currentRound(); let h="";
  L.filter(x=>x.n!==S.round).forEach(x=>{ const qd=(x.j.res==="Adiado"&&!x.j.remarcado)?"nova data a definir":fmtWhen(x.j); h+=`<button class="btn atraso" data-goround="${x.n}">⏰ Jogo adiado da ${x.n}ª rodada: <b>${esc(x.j.m)} x ${esc(x.j.v)}</b> · ${qd} · palpitar</button>`; });

function brTable(){
  const T={}; const add=(t)=>T[t]||(T[t]={t,j:0,v:0,e:0,d:0,gp:0,gc:0});
  for(let n=1;n<=38;n++){const r=S.rod[n]; if(!r) continue; for(const j of r.jogos){ add(j.m);add(j.v); const s=parse(j.res); if(!s) continue;
    const a=T[j.m],b=T[j.v]; a.j++;b.j++; a.gp+=s[0];a.gc+=s[1];b.gp+=s[1];b.gc+=s[0];
    if(s[0]>s[1]){a.v++;b.d++;}else if(s[0]<s[1]){b.v++;a.d++;}else{a.e++;b.e++;} }}
  const rows=Object.values(T).map(x=>({...x,p:x.v*3+x.e,sg:x.gp-x.gc}));
  rows.sort((a,b)=>b.p-a.p||b.v-a.v||b.sg-a.sg||b.gp-a.gp||a.t.localeCompare(b.t));
  return rows;
}

  r.jogos.forEach((j,i)=>{ if(locked(j)) return; const id=nn+"-g"+i; const cur=(S.own[id]||{}).palpite||""; const nv=D.palpites[i]||"";
    if(cur!==nv){ b.set(doc(db,"apostas",id,"p",who),{palpite:nv,em:serverTimestamp()}); b.set(doc(db,"meus",S.uid,"p",id),{palpite:nv}); count++; } });
  if(!dobroFechado(n)){ const cd=S.own[nn+"-dobro"]; const cur=cd?cd.dobro??null:null;
    if(cur!==D.dobro){ b.set(doc(db,"dobros",nn,"p",who),{jogo:D.dobro,em:serverTimestamp()}); b.set(doc(db,"meus",S.uid,"p",nn+"-dobro"),{dobro:D.dobro}); count++; } }
  S.saving=true; const m=$("#savemsg"); if(m) m.textContent="Salvando…";
  try{ if(count) await b.commit(); D.dirty=false;
    S.saveMsg=(count?"Palpites salvos às ":"Nada novo para salvar · ")+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+" · ocultos até cada jogo começar"; }
  catch(e){ S.saveMsg=e&&e.code==="permission-denied"?"Não foi salvo: o prazo de algum jogo já fechou. Atualize a página e confira.":"Não foi possível salvar agora. Tente de novo."; }
  S.saving=false; const m2=$("#savemsg"); if(m2) m2.textContent=S.saveMsg;
}
async function sendRes(){
  const n=S.round,r=S.rod[n]; const nn=nnOf(n); const msg=$("#resmsg"); const jobs=[]; let bad=false;
  r.jogos.forEach((j,i)=>{const el=$("#rv"+i); if(!el) return; let v=el.value.trim(); if(!v) return; if(/^adiado$/i.test(v)) v="Adiado"; else if(parse(v)) v=v.replace(/\s/g,"").toLowerCase(); else {bad=true;return;} jobs.push([nn+"-g"+i,{n,jogo:i,res:v,por:S.uid,em:serverTimestamp()}]);});
  if(bad){msg.textContent="Use o formato 2x1 ou Adiado.";return;}
  if(!jobs.length){msg.textContent="Nenhum placar preenchido.";return;}
  msg.textContent="Publicando…"; const b=writeBatch(db); jobs.forEach(([id,d])=>b.set(doc(db,"resultados",id),d));
  try{ await b.commit(); msg.textContent="Placares publicados."; }catch(e){ msg.textContent="Não foi possível publicar ("+(e&&e.code||"erro")+")."; }
}
async function unlockRes(){
  const c=$("#rescode").value.trim(); if(!c||!S.uid) return;
  try{ await setDoc(doc(db,"papeis",S.uid),{codigo:c,resultados:true}); S.resCode=true; S.tab="resultados"; render(true); }
  catch(e){ $("#rcmsg").textContent="Código inválido."; }
}
async function runImport(btn){
  const msg=$("#impmsg"); btn.disabled=true;
  try{
    msg.textContent="Registrando você como organizador…"; await setDoc(doc(db,"admins",S.uid),{em:serverTimestamp()});
    msg.textContent="Lendo os dados do bolão…"; const seed=await (await fetch("seed.json",{cache:"no-store"})).json();
    const tokens={}; seed.config.participantes.forEach(p=>{tokens[p.slug]=p.slug+"-"+rand(14);}); const code="RES-"+rand(8);
    const ops=[]; const ts=s=>s?Timestamp.fromDate(new Date(s)):null;
    for(const [id,r] of Object.entries(seed.rodadas)){ const n=r.n;
      const fx=seed.config.dobroPrazo&&seed.config.dobroPrazo[n]; const ks=r.jogos.map(j=>j.quando).filter(Boolean).map(s=>new Date(s).getTime());
      const prazo=fx?new Date(fx):(ks.length?new Date(Math.min(...ks)):null);
      ops.push(["rodadas",id,{...r,prazoDobro:prazo?Timestamp.fromDate(prazo):null}]);
      r.jogos.forEach((j,i)=>ops.push(["jogos",id+"-g"+i,{n,i,inicio:ts(j.quando)}])); }
    for(const [id,h] of Object.entries(seed.historico)) ops.push(["historico",id,h]);
    for(const [id,v] of Object.entries(seed.revelados)) ops.push(["revelados",id,v]);
    for(const [s,t] of Object.entries(tokens)) ops.push(["convites",t,{slug:s}]);
    ops.push(["codigosResultado",code,{em:serverTimestamp()}]);
    ops.push(["privado","links",{tokens,codigoResultados:code}]);
    for(let k=0;k<ops.length;k+=400){ const b=writeBatch(db); ops.slice(k,k+400).forEach(([c,id,d])=>b.set(doc(db,c,id),d)); msg.textContent=`Gravando ${Math.min(k+400,ops.length)} de ${ops.length}…`; await b.commit(); }
    await setDoc(doc(db,"config","geral"),seed.config);
    msg.textContent="Pronto! Bolão configurado."; S.canEdit=true; location.reload();
  }catch(e){ msg.textContent="Erro na importação: "+(e&&e.message||e); btn.disabled=false; }
}
function vSetup(){
  if(!S.uid) return vLogin();
  return `<h2>Configurar o bolão</h2><div class="card" style="margin-top:12px"><p>Este é o primeiro acesso. Ao continuar, sua conta vira a de <b>organizador</b> (só cuida da configuração) e o app importa as 38 rodadas, o histórico das rodadas 1 a 28 e os palpites já revelados.</p><p class="sub">Também são gerados os links exclusivos dos participantes e o código de resultados.</p><div class="row"><button class="btn primary" id="doimport">Configurar e importar dados</button><span id="impmsg" class="muted"></span></div></div>`;
}
function vLogin(){
  return `<h2>Bem-vindo ao Bolão dos Patos 🦆</h2><p class="sub">Entre com sua conta Google para ver o ranking e palpitar.</p>
  <div class="card" style="margin-top:12px;display:grid;gap:12px"><button class="btn primary" id="glogin" style="font-size:16px;padding:12px">Entrar com Google</button>
  <p class="sub" style="margin:0"><b>Já entrou antes?</b> É só tocar em “Entrar com Google” e escolher a mesma conta do primeiro acesso.</p>
  <p class="sub" style="margin:0"><b>Primeira vez?</b> Abra o link exclusivo que o organizador te mandou e entre com o Google. O link é seu: não repasse.</p>
  <p class="sub" style="margin:0">Dica: no celular, use “Adicionar à tela de início” para ter o bolão como app.</p></div>`;
}
async function doLogin(){ const p=new GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"}); try{ await signInWithPopup(auth,p); }catch(e){ try{ await signInWithRedirect(auth,p); }catch(_){ } } }

/* ---------- dados ---------- */
let started=false;
function startData(){
  if(started) return; started=true;
  const num=id=>parseInt(String(id).replace(/\D/g,""),10); const err=()=>{};
  onSnapshot(doc(db,"config","geral"),s=>{ S.cfgExists=s.exists(); S.cfg=s.exists()?s.data():{participantes:[]}; S.loaded.config=true; render(); },err);
  const mergeRod=()=>{ const o={}; for(const [n,r] of Object.entries(S.rodRaw)){ o[n]={...r,jogos:r.jogos.map((j,i)=>{const id=nnOf(n)+"-g"+i; const R=S.resDocs[id]; if(R&&R.res) return {...j,res:R.res}; const X=S.ext[id]; return (!parse(j.res)&&X&&X.res&&X.final)?{...j,res:X.res}:j;})}; } S.rod=o; };
  onSnapshot(collection(db,"rodadas"),q=>{S.rodRaw={};q.forEach(d=>{S.rodRaw[num(d.id)]=d.data();});mergeRod();S.loaded.rodadas=true;fetchRevealed();render();},err);
  onSnapshot(collection(db,"resultados"),q=>{S.resDocs={};q.forEach(d=>{S.resDocs[d.id]=d.data();});mergeRod();fetchRevealed();render();},err);
  onSnapshot(collection(db,"historico"),q=>{S.hist={};q.forEach(d=>{S.hist[num(d.id)]=d.data();});render();},err);
  onSnapshot(collection(db,"revelados"),q=>{S.revLegacy={};q.forEach(d=>{S.revLegacy[d.id]=d.data(); if(d.data().palpites) mergeRev(d.id); else S.rev[d.id]=d.data();});render();},err);
  onSnapshot(collection(db,"externos"),q=>{S.ext={};q.forEach(d=>{S.ext[d.id]=d.data(); mergeRev(d.id);});mergeRod();render();},err);
  setInterval(()=>{ fetchRevealed(); if(!typing()) render(); },15000);
}
onAuthStateChanged(auth,async u=>{
  S.uid=u?u.uid:null; S.userName=u?(u.displayName||u.email||""):""; S.tokSlug=null; S.canEdit=false; S.resCode=false; S.badToken=false;
  startData(); if(S.uid) await loadIdentity(); S.authKnown=true; render(true);
});
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
